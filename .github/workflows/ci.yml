name: Python and browser verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Syntax check
        run: python -m compileall -q agents dbt_sentinel cli.py enrichment.py simulator.py
      - name: Test suite
        run: python -m pytest -q
      - name: Smoke test installed CLI
        run: |
          mammography-tomosynthesis-dbt-agent audit --task-id CI-TEST --target SYNTH-CI --primary 10 --secondary 2 --status NOMINAL
          mammography-tomosynthesis-dbt-engine audit --task-id CI-TEST --target SYNTH-CI --primary 10 --secondary 2 --status NOMINAL
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: |
          node --check web/app.mjs
          node --check web/logic.mjs
      - name: Browser rule tests
        run: node --test web/logic.test.mjs
