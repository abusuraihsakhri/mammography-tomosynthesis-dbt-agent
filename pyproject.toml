[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mammography-tomosynthesis-dbt-engine"
version = "2.0.0"
description = "DBT-Sentinel: Digital Breast Tomosynthesis Slice Reconstruction Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mammography-tomosynthesis-dbt-engine = "dbt_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/mammography-tomosynthesis-dbt-engine"
Repository = "https://github.com/abusuraihsakhri/mammography-tomosynthesis-dbt-engine.git"
