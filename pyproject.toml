[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mammography-tomosynthesis-dbt-engine"
version = "2.0.0"
description = "DBT-Sentinel: Digital Breast Tomosynthesis Slice Reconstruction Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
mammography-tomosynthesis-dbt-engine = "dbt_sentinel.cli:main"
mammography-tomosynthesis-dbt-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "dbt_sentinel_app"]

[tool.setuptools.packages.find]
include = ["agents*", "dbt_sentinel*", "web"]

[tool.setuptools.package-data]
web = ["*.html", "*.mjs"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/mammography-tomosynthesis-dbt-agent"
Repository = "https://github.com/abusuraihsakhri/mammography-tomosynthesis-dbt-agent.git"
